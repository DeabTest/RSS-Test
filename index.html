<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSS Läsare</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      height: 100vh;
    }

    #rssFeed {
      max-width: 100%;
      padding-left: 10px;
      box-sizing: border-box;
      line-height: 1.2;
    }

    .event-title {
      font-size: 30px;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }
  </style>
</head>
<body>
  <div id="rssFeed">
    <div id="eventTitle" class="event-title"></div>
  </div>

  <script>
    const proxyUrl = "https://cozy-cobbler-0ca46b.netlify.app/.netlify/functions/rss-proxy";
    const rotationMs = 10_000;
    const refreshMs = 60 * 60_000;
    const retryMs = 60_000;
    const requestTimeoutMs = 15_000;
    const welcomeMessage = "VÄLKOMMEN TILL ESKILSTUNA";
    const eventTitle = document.getElementById("eventTitle");

    let events = [];
    let currentEventIndex = 0;
    let eventInterval;

    const monthMap = {
      jan: 1, feb: 2, mar: 3, apr: 4, maj: 5, jun: 6,
      jul: 7, aug: 8, sep: 9, okt: 10, nov: 11, dec: 12
    };

    function formatDateRange(title) {
      const datePattern = /^(\d{1,2})\s(\w{3})(?:\s?-\s?(\d{1,2})\s?(\w{3}))?/i;
      const match = title.match(datePattern);
      if (match) {
        const startDay = parseInt(match[1], 10);
        const startMonth = monthMap[match[2].toLowerCase()];
        if (match[3] && match[4]) {
          const endDay = parseInt(match[3], 10);
          const endMonth = monthMap[match[4].toLowerCase()];
          return `${startDay}/${startMonth} - ${endDay}/${endMonth}`;
        }
        return `${startDay}/${startMonth}`;
      }
      return '';
    }

    function decodeHtmlEntities(text) {
      const textarea = document.createElement('textarea');
      textarea.innerHTML = text;
      return textarea.value;
    }

    async function fetchRSS() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), requestTimeoutMs);
      let nextRefresh = refreshMs;
      try {
        const response = await fetch(proxyUrl, { cache: "no-store", signal: controller.signal });
        if (!response.ok) throw new Error(`Kunde inte hämta RSS-flödet (HTTP ${response.status}).`);
        const data = await response.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(data, "text/xml");
        const channel = xmlDoc.querySelector("rss > channel");
        if (xmlDoc.querySelector("parsererror") || !channel) {
          throw new Error("RSS-flödet hade ett ogiltigt format.");
        }

        const items = channel.getElementsByTagName("item");
        const nextEvents = [];
        for (const item of items) {
          let title = item.getElementsByTagName("title")[0]?.textContent || '';
          const formattedDate = formatDateRange(title);
          title = title.replace(/^(\d{1,2}\s\w{3}(?:\s?-\s?\d{1,2}\s?\w{3})?)\s*/, '').replace(/^,/, '').trim();
          const displayTitle = `${formattedDate} ${decodeHtmlEntities(title)}`.trim();
          if (displayTitle) nextEvents.push({ title: displayTitle });
        }
        if (items.length > 0 && nextEvents.length === 0) {
          throw new Error("RSS-flödet saknade visningsbara titlar.");
        }

        updateEvents(nextEvents);
      } catch (error) {
        console.error(error);
        if (events.length === 0) eventTitle.textContent = welcomeMessage;
        nextRefresh = retryMs;
      } finally {
        clearTimeout(timeout);
        setTimeout(fetchRSS, nextRefresh);
      }
    }

    function updateEvents(nextEvents) {
      events = nextEvents;
      if (events.length === 0) {
        clearInterval(eventInterval);
        eventInterval = undefined;
        eventTitle.textContent = welcomeMessage;
        return;
      }

      const displayedIndex = eventInterval === undefined
        ? -1
        : events.findIndex(({ title }) => title === eventTitle.textContent);
      currentEventIndex = (displayedIndex + 1) % events.length;
      if (displayedIndex === -1) {
        clearInterval(eventInterval);
        showNextEvent();
        eventInterval = setInterval(showNextEvent, rotationMs);
      }
    }

    function showNextEvent() {
      eventTitle.textContent = events[currentEventIndex].title;
      currentEventIndex = (currentEventIndex + 1) % events.length;
    }

    fetchRSS();
  </script>
</body>
</html>
